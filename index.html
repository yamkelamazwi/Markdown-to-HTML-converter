<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to HTML Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Markdown to HTML Converter</h1>

  <p id="author">
    Built by <strong>Yamkela Mazwi</strong>
  </p>

  <div id="container">

    <div class="container">
      <h2>Markdown Input</h2>

      <textarea
        id="markdown-input"
        placeholder="Enter your markdown here..."
      ></textarea>

      <div class="controls">
        <span id="char-count">Characters: 0</span>

        <button id="copy-btn">
          Copy HTML
        </button>

        <button id="clear-btn">
          Clear
        </button>
      </div>
    </div>

    <div class="container">
      <h2>Raw HTML Output</h2>
      <div id="html-output"></div>
    </div>

    <div class="container">
      <h2>HTML Preview</h2>
      <div id="preview"></div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
